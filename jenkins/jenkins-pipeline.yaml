pipeline:
  agent:
    label: any

  environment:
    CI: "true"  # Это строковое значение для переменной окружения

  stages:
    - stage: Checkout Code
      steps:
        - checkout: {}  # Исправлено с "true" на пустой объект для корректной интерпретации

    - stage: Install Dependencies
      steps:
        - sh: "npm ci"

    - stage: Install Playwright Browsers
      steps:
        - sh: "npx playwright install"

    - stage: Run Playwright Tests
      steps:
        - sh: "npx playwright test"

    - stage: Archive Report
      steps:
        - sh: "zip -r playwright-report.zip playwright-report || true"
        - archiveArtifacts:
            artifacts: "playwright-report.zip"
